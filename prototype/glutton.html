<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暴食者 (Glutton) · 原型三版本</title>
<!--
  Three variants of the Brotato character guide page, switchable via ?variant=, on throwaway route prototype/glutton.html.
  Variants: A 长文攻略式 / B 仪表盘卡片式 / C 时间轴流程式. Same DATA object, different rendering. Throwaway, no tests.
-->
<style>
  :root { --bg:#f7f5ef; --card:#fff; --ink:#1f1b16; --muted:#7a7166; --line:#e7e0d2; --acc:#b3541e; --good:#0e8a16; --warn:#9a3412; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  a { color:#0b5fff; }
  .proto { background:#1f1b16; color:#ffd966; font-size:13px; padding:8px 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .proto a { color:#ffd966; }
  .topbar { position:sticky; top:0; z-index:5; background:rgba(247,245,239,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 14px; display:flex; gap:10px; align-items:center; }
  .topbar .back { font-size:14px; text-decoration:none; }
  .topbar .t { font-weight:800; }
  .topbar .t small { font-weight:400; color:var(--muted); }
  .wrap { max-width:860px; margin:0 auto; padding:14px 14px 110px; }
  .ver { font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:10px 0; }
  .pill { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted); background:#fff; margin:2px 4px 2px 0; }
  .pill.hot { color:var(--good); border-color:var(--good); }
  .pill.dlc { color:var(--warn); border-color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
  .card h2 { font-size:17px; margin:0 0 8px; }
  .card h3 { font-size:15px; margin:12px 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  /* Variant A: doc */
  .A .hero { background:#1f1b16; color:#fdf6e3; border-radius:16px; padding:18px 16px; }
  .A .hero h1 { margin:0 0 6px; font-size:24px; }
  .A .hero p { margin:6px 0; color:#e8ddc4; }
  .A .toc { position:sticky; top:53px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; display:flex; gap:8px; overflow-x:auto; font-size:13px; }
  .A .toc a { white-space:nowrap; text-decoration:none; background:#f2ecdd; border-radius:999px; padding:4px 10px; color:var(--ink); }
  .A ol.tight li, .A ul.tight li { margin:4px 0; }
  /* Variant B: dashboard */
  .B .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .B .kpi { background:#1f1b16; color:#fdf6e3; border-radius:14px; padding:12px; }
  .B .kpi b { display:block; font-size:20px; }
  .B .kpi span { font-size:12px; color:#d9cba6; }
  .B .cols { display:grid; grid-template-columns:2fr 1fr; gap:12px; align-items:start; }
  .B .rail { position:sticky; top:60px; }
  .B .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  /* Variant C: timeline */
  .C .strip { display:flex; gap:8px; overflow-x:auto; background:#1f1b16; color:#fdf6e3; border-radius:14px; padding:12px; font-size:13px; }
  .C .tl { position:relative; margin:14px 0 0 10px; padding-left:22px; border-left:3px solid #1f1b16; }
  .C .node { position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:0 0 14px; }
  .C .node::before { content:""; position:absolute; left:-32px; top:16px; width:14px; height:14px; border-radius:50%; background:var(--acc); border:3px solid #fff; box-shadow:0 0 0 2px #1f1b16; }
  .C .node .wave { font-weight:800; font-size:14px; }
  .C .warn { background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:8px 10px; font-size:14px; margin:8px 0; }
  /* switcher */
  #switcher { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:10px; background:#111; color:#fff; border-radius:999px; padding:8px 10px; box-shadow:0 8px 30px rgba(0,0,0,.35); font-size:14px; }
  #switcher button { width:36px; height:36px; border-radius:50%; border:0; background:#2a2a2a; color:#fff; font-size:18px; cursor:pointer; }
  #switcher .lab { min-width:170px; text-align:center; }
  #switcher .lab small { display:block; font-size:11px; color:#ffd966; }
  #state { font-size:12px; color:var(--muted); margin-top:14px; word-break:break-all; }
  cite.src { display:block; font-style:normal; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }
  @media (max-width:720px){
    .B .kpis { grid-template-columns:repeat(2,1fr); }
    .B .cols { grid-template-columns:1fr; }
    .B .rail { position:static; }
    .A .hero h1 { font-size:20px; }
    #switcher .lab { min-width:140px; }
  }
</style>
</head>
<body>
<div class="proto">PROTOTYPE throwaway · 假数据演示 · 不定终稿 · 对应票 <b>页面模板原型：一页一样式，多方案可点</b> · 数据同源、三渲染 · <a href="./index.html">← 索引页</a></div>
<div class="topbar">
  <a class="back" href="./index.html">← 索引</a>
  <div class="t">暴食者 (Glutton) <small>本体 · 假数据 · 取材 Nightmare Guide</small></div>
</div>
<div class="wrap"><div id="app"></div><div id="state"></div></div>

<nav id="switcher" aria-label="原型版本切换">
  <button id="prev" aria-label="上一个">←</button>
  <div class="lab"><span id="vlabel">A</span><small>点击箭头或按 ← → 切换 · URL 可分享</small></div>
  <button id="next" aria-label="下一个">→</button>
</nav>

<script>
// ---- 同源假数据：单模板复用的“同一份数据” ----
const DATA = {
  slug: "glutton", zh: "暴食者", en: "Glutton", dlc: null,
  hook: "击杀回血的滚雪球坦克：前期堆伤害速清，中期转最大生命 (Max HP) + 生命窃取 (Life Steal)，后期靠高血量硬吃弹幕。（假数据，待内容票校对）",
  difficulty: "Nightmare Guide", stateNote: "Ultimate Nightmares 有更高解，Danger 5 保底不启用",
  attrs: [
    ["最大生命 (Max HP)", "S · 无脑堆"], ["生命窃取 (Life Steal)", "S · 中期质变"],
    ["近战伤害 (Melee Damage)", "A · 前期清线"], ["护甲 (Armor)", "A · 13波后补"],
    ["闪避 (Dodge)", "B · 锦上添花"], ["收获 (Harvesting)", "C · 别前期拿"]
  ],
  weaponsT1: [["拳 (Fist)", "贴脸回血最稳，链式反应挂件多"], ["冲锋枪 (SMG)", "前期过渡最滑"]],
  weaponsT2: [["火焰喷射器 (Flamethrower)", "清潮快但怕单体"], ["剪刀 (Scissors)", "花活上限，不作主 build"]],
  items: ["小猪存钱罐 (Piggy Bank)", "咖啡 (Coffee)", "勋章 (Medal)", "触手 (Tentacle)", "再生药水 (Adrenaline)"],
  phases: [
    { w: "W1–5 开局", d: "锁 1 把 T1 武器升满；只拿近战伤害 (Melee Damage) / 攻击速度 (Attack Speed)；商店 10 币内不锁，优先免费重随。", buy: "拳 (Fist) → 冲锋枪 (SMG) 过渡" },
    { w: "W6–12 中期", d: "转最大生命 (Max HP) + 生命窃取 (Life Steal)；3 币内锁触手 / 勋章；工程 (Engineering) 顺手拿，不主动追。", buy: "补第 2 把 T1，开始吃生命窃取" },
    { w: "W13–20 后期", d: "护甲 (Armor) 补到 15+；闪避 (Dodge) 有就拿；站撸少走位，多吃材料回血。", buy: "T1 升满后追爆炸伤害 (Explosion Damage)" }
  ],
  shop: "锁武器 > 生命窃取 (Life Steal) > 最大生命 (Max HP) > 护甲 (Armor)；收获 (Harvesting) 前 8 波不买；重随只在缺关键件时点 1–2 次。",
  pitfalls: ["别前期拿收获 (Harvesting)：拖清线速度，中期再补。", "别双 T2 开局：火焰喷射器 + 剪刀前期刮痧。", "Crash Zone 地图后缀别混用：默认图 build 不直接套深渊图。"],
  hard: "Ultimate Nightmares 下把闪避 (Dodge) 提一档，护甲阈值 20+；教学局外的 Nightmare 实况复盘需注明“非教学局”。",
  source: { title: "CHAIN REACTION - Glutton - Brotato Nightmare Guide", vid: "Jud6a0Vl2P4", url: "https://www.youtube.com/watch?v=Jud6a0Vl2P4", pub: "2026-10（RSS 日更，精确到日待补）", game: "适用版本：Abyssal Terrors DLC 后 Steam 当前版本；大更新早于视频日期则标待重审" }
};
const VARIANTS = [
  { k: "A", name: "长文攻略式", desc: "单列沉浸阅读" },
  { k: "B", name: "仪表盘卡片式", desc: "一眼看全 + 右 rail" },
  { k: "C", name: "时间轴流程式", desc: "按波次推进" }
];
function getV(){ const v = new URLSearchParams(location.search).get("variant"); return VARIANTS.some(x=>x.k===v)? v : "A"; }
function setV(v){ const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null,"",u); render(); }
function srcHTML(){
  const s = DATA.source;
  return `<cite class="src">主取材：<a href="${s.url}">${s.title}</a><br>视频 ID：<code>${s.vid}</code> / 发布：${s.pub} / 难度：${DATA.difficulty} / 角色：${DATA.en}<br>${s.game} · 转述非搬运，只留可复现骨架</cite>`;
}
function renderA(){
  return `<div class="A">
    <div class="hero"><h1>暴食者 (Glutton) <span class="pill hot">Nightmare Guide</span></h1>
    <p><b>机制一句话：</b>${DATA.hook}</p>
    <p style="font-size:13px">写法演示：中文 (English) · DLC 角标如诅咒 (Curse)（Abyssal Terrors DLC）· 版本双标注见页底</p></div>
    <div class="ver">取材视频（2026-10）＋ 适用版本（Abyssal Terrors 后）· Danger 5 保底不启用 · 假数据</div>
    <nav class="toc"><a href="#a-attr">核心属性</a><a href="#a-w">武器 T1/T2</a><a href="#a-p">开局/中/后期</a><a href="#a-shop">商店</a><a href="#a-pit">避坑</a><a href="#a-src">取材</a></nav>
    <div class="card" id="a-attr"><h2>核心属性优先级</h2>
      <table><tr><th>属性</th><th>评级</th></tr>${DATA.attrs.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td></tr>`).join("")}</table></div>
    <div class="card" id="a-w"><h2>推荐武器</h2><h3>T1 主选</h3>
      <table>${DATA.weaponsT1.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td></tr>`).join("")}</table>
      <h3>T2 备选</h3><table>${DATA.weaponsT2.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td></tr>`).join("")}</table>
      <h3>关键道具 3–5 件</h3><div>${DATA.items.map(i=>`<span class="pill">${i}</span>`).join("")}</div></div>
    <div class="card" id="a-p"><h2>开局 / 中 / 后期</h2><ol class="tight">${DATA.phases.map(p=>`<li><b>${p.w}：</b>${p.d}<br><span style="color:var(--muted)">买什么：${p.buy}</span></li>`).join("")}</ol></div>
    <div class="card" id="a-shop"><h2>商店与升级优先级</h2><p>${DATA.shop}</p><h2>避坑 1–3 条</h2><ul class="tight">${DATA.pitfalls.map(p=>`<li>${p}</li>`).join("")}</ul>
      <h2>高难特例</h2><p>${DATA.hard}</p></div>
    <div class="card" id="a-src"><h2>取材与版本</h2>${srcHTML()}</div>
  </div>`;
}
function renderB(){
  return `<div class="B">
    <div class="kpis">
      <div class="kpi"><span>核心思路</span><b>击杀回血</b><span>滚雪球坦克</span></div>
      <div class="kpi"><span>第一属性</span><b>Max HP</b><span>最大生命 (Max HP)</span></div>
      <div class="kpi"><span>主武器</span><b>Fist</b><span>拳 (Fist)</span></div>
      <div class="kpi"><span>难度</span><b>Nightmare</b><span>${DATA.difficulty}</span></div>
    </div>
    <div class="chips" style="margin-top:10px">${DATA.attrs.map(a=>`<span class="pill">${a[0]} · ${a[1]}</span>`).join("")}</div>
    <div class="cols"><div>
      <div class="card"><h2>机制一句话</h2><p>${DATA.hook}</p></div>
      <div class="card"><h2>武器 T1 / T2</h2>
        <table><tr><th>梯度</th><th>武器</th><th>一句话</th></tr>
        ${DATA.weaponsT1.map(w=>`<tr><td>T1</td><td><b>${w[0]}</b></td><td>${w[1]}</td></tr>`).join("")}
        ${DATA.weaponsT2.map(w=>`<tr><td>T2</td><td><b>${w[0]}</b></td><td>${w[1]}</td></tr>`).join("")}</table></div>
      <div class="card"><h2>分期打法</h2>${DATA.phases.map(p=>`<p><b>${p.w}</b> — ${p.d}</p>`).join("")}</div>
    </div><div class="rail">
      <div class="card"><h2>商店优先级</h2><p style="font-size:14px">${DATA.shop}</p></div>
      <div class="card"><h2>避坑</h2><ul class="tight" style="font-size:14px">${DATA.pitfalls.map(p=>`<li>${p}</li>`).join("")}</ul></div>
      <div class="card"><h2>取材</h2>${srcHTML()}</div>
    </div></div>
  </div>`;
}
function renderC(){
  return `<div class="C">
    <div class="strip"><span>最大生命 (Max HP) → 生命窃取 (Life Steal) → 近战伤害 (Melee Damage) → 护甲 (Armor)</span><span>·</span><span>T1 拳/冲锋枪 · T2 火焰/剪刀（假数据）</span></div>
    <div class="card"><h2>暴食者 (Glutton) · 跟着波次打</h2><p>${DATA.hook}</p><div>${DATA.items.map(i=>`<span class="pill">${i}</span>`).join("")}</div></div>
    <div class="tl">${DATA.phases.map(p=>`<div class="node"><div class="wave">${p.w}</div><p>${p.d}</p><p style="color:var(--muted);font-size:14px">买：${p.buy}</p></div>`).join("")}</div>
    <div class="warn"><b>避坑：</b>${DATA.pitfalls[0]}</div>
    <div class="warn"><b>高难：</b>${DATA.hard}</div>
    <div class="card"><h2>商店总纲</h2><p>${DATA.shop}</p></div>
    <div class="card"><h2>取材与版本</h2>${srcHTML()}</div>
  </div>`;
}
function render(){
  const v = getV(); const meta = VARIANTS.find(x=>x.k===v);
  document.getElementById("app").innerHTML = v==="A"? renderA() : v==="B"? renderB() : renderC();
  document.getElementById("vlabel").textContent = `${v} · ${meta.name}（${meta.desc}）`;
  document.getElementById("state").innerHTML =
    `state: variant=${v} · slug=${DATA.slug} · source=假数据 + 取材规范票结论 · <a href="./glutton.html?variant=${v}">分享当前版本 URL</a> · 其它版本：` +
    VARIANTS.map(x=>`<a href="./glutton.html?variant=${x.k}">${x.k}</a>`).join(" ");
}
document.getElementById("prev").onclick = ()=>{ const vs=["A","B","C"]; setV(vs[(vs.indexOf(getV())+2)%3]); };
document.getElementById("next").onclick = ()=>{ const vs=["A","B","C"]; setV(vs[(vs.indexOf(getV())+1)%3]); };
document.addEventListener("keydown", e=>{
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (e.key==="ArrowLeft") document.getElementById("prev").click();
  if (e.key==="ArrowRight") document.getElementById("next").click();
});
render();
</script>
</body>
</html>
