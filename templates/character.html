<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{PAGE_TITLE}}</title>
<style>
:root { --bg:#f7f5ef; --card:#fff; --ink:#1f1b16; --muted:#7a7166; --line:#e7e0d2; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
a { color:#0b5fff; }
.wrap { max-width:720px; margin:0 auto; padding:14px 14px 80px; }
.topbar { position:sticky; top:0; z-index:5; background:rgba(247,245,239,.94); padding:10px 14px; border-bottom:1px solid var(--line); }
.hero { background:#1f1b16; color:#fdf6e3; border-radius:16px; padding:18px 16px; }
.hero h1 { margin:0 0 6px; font-size:24px; }
.hero p { margin:6px 0; color:#e8ddc4; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
.card h2 { font-size:17px; margin:0 0 8px; }
.card h3 { font-size:15px; margin:12px 0 6px; }
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; }
td.rating-cell { width:2.6em; text-align:center; white-space:nowrap; }
.rating { display:inline-block; min-width:1.9em; padding:1px 6px; border-radius:999px; font-weight:800; text-align:center; font-size:14px; }
.rating-S { color:#b71c1c; background:#ffebee; }
.rating-A { color:#e65100; background:#fff3e0; }
.rating-B { color:#2e7d32; background:#e8f5e9; }
.rating-C { color:#1565c0; background:#e3f2fd; }
.rating-D { color:#616161; background:#eeeeee; }
.rating-F { color:#fff; background:#424242; }
.rating-none { color:#9e9e9e; border:1px dashed #bdbdbd; background:transparent; font-weight:400; }
.empty { color:#9e9e9e; }
.badge-pending { display:inline-block; font-size:12px; border:1px solid #9a3412; color:#9a3412; border-radius:999px; padding:2px 9px; margin-left:8px; }
.badge-recheck { display:inline-block; font-size:11px; border:1px solid #b26a00; color:#fff; background:#b26a00; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
.badge-resource { display:inline-block; font-size:11px; border:1px solid #1565c0; color:#fff; background:#1565c0; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
.badge-dlc { display:inline-block; font-size:11px; border:1px solid #9a3412; color:#fff; background:#9a3412; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
.badge-review { display:inline-block; font-size:11px; border:1px dashed #9a3412; color:#9a3412; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
.coverbadge { display:inline-block; font-size:13px; border:1px solid #0e8a16; background:#e8f5e9; color:#1b5e20; border-radius:999px; padding:6px 14px; margin:8px 0; }
.seg { position:sticky; top:0; z-index:6; background:rgba(247,245,239,.96); padding:10px 0 6px; display:flex; gap:8px; overflow-x:auto; }
.seg [role=tab] { flex:1 0 auto; min-height:44px; font-size:15px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; white-space:nowrap; }
.seg [role=tab][aria-selected=true] { background:#1f1b16; color:#fff; border-color:#1f1b16; font-weight:700; }
.seg [role=tab]:focus-visible { outline:3px solid #0b5fff; outline-offset:2px; }
[role=tabpanel][hidden] { display:none; }
.sic { width:20px; height:20px; vertical-align:-4px; image-rendering:pixelated; background:#efe9d8; border-radius:6px; }
.sic.none { display:inline-flex; width:20px; height:20px; vertical-align:-4px; align-items:center; justify-content:center; font-size:12px; color:var(--muted); background:#f2ecdd; border-radius:6px; }
.has-tip { position:relative; border-bottom:1px dotted var(--muted); cursor:help; }
.has-tip .tip { display:none; position:absolute; left:0; top:100%; margin-top:6px; z-index:30; background:#1f1b16; color:#fdf6e3; border-radius:10px; padding:8px 10px; font-size:12px; min-width:min(340px, 80vw); max-width:min(360px, 90vw); box-shadow:0 8px 24px rgba(0,0,0,.35); }
.has-tip:hover .tip, .has-tip:focus .tip, .has-tip:focus-within .tip { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px 8px; }
/* 靠底向上：仅末几行翻转，避免滚出裁剪；其余仍向下。 */
.table-wrap tr:nth-last-child(-n+5) .has-tip .tip { top:auto; bottom:100%; margin-top:0; margin-bottom:6px; box-shadow:0 -8px 24px rgba(0,0,0,.35); }
.tip .th { grid-column:1 / -1; display:block; font-weight:700; color:#ffd966; margin-bottom:2px; }
.tip .ti { display:flex; gap:5px; align-items:center; margin:0; min-width:0; font-size:11px; line-height:1.35; overflow:hidden; }
.tip .ti img { width:24px; height:24px; flex:0 0 24px; object-fit:contain; image-rendering:pixelated; background:rgba(255,255,255,.12); border-radius:6px; }
.tip .tn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.tip .tm { grid-column:1 / -1; color:#b9ad93; font-size:11px; }
.tip .kv { grid-column:1 / -1; display:flex; justify-content:space-between; gap:8px; font-size:11px; line-height:1.5; }
.tip .ke { color:#b9ad93; flex:0 0 auto; }
.tip .kx { text-align:right; min-width:0; overflow-wrap:anywhere; }
.pos { color:rgb(0,255,0); font-weight:700; }
.neg { color:rgb(244,0,0); font-weight:700; }
.tip .tw { grid-column:1 / -1; min-width:0; }
table.wt { width:100%; border-collapse:collapse; font-size:11px; line-height:1.45; }
.wt th, .wt td { padding:3px 4px; vertical-align:top; border-bottom:1px solid rgba(255,255,255,.08); }
.wt th { color:#b9ad93; font-weight:600; text-align:left; white-space:nowrap; }
.wt td { text-align:center; overflow-wrap:anywhere; }
.wt td.span { text-align:left; }
.w1 { color:#e8e6df; font-weight:700; }
.w2 { color:#5aa9ff; font-weight:700; }
.w3 { color:#c77dff; font-weight:700; }
.w4 { color:#ff6b6b; font-weight:700; }
/* 装备表不裁剪：武器表只有 2-3 行而悬浮高，滚动容器会拦腰截断一切
   向下开的 tip（#15 实测）。属性表靠“表长 + tip 短 + 末行上翻” stays
   in-container；装备表行少，改为 wrapper 不裁剪，翻转规则与属性共用一套。 */
.table-wrap.gear-wrap { overflow:visible; }
.tip .tf { grid-column:1 / -1; display:block; color:#b9ad93; margin-top:2px; font-size:11px; }
.legend { font-size:12px; color:var(--muted); margin:0 0 10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.toc { position:sticky; top:53px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 10px; display:flex; gap:8px; overflow-x:auto; font-size:13px; }
.toc a { white-space:nowrap; text-decoration:none; background:#f2ecdd; border-radius:999px; padding:4px 10px; color:var(--ink); }
.footer { font-size:12px; color:var(--muted); margin-top:16px; }
:focus-visible { outline:3px solid #0b5fff; outline-offset:2px; }
@media (max-width:480px){ .hero h1 { font-size:20px; } }
</style>
</head>
<body>
<div class="topbar"><a href="./index.html">← 索引</a></div>
<div class="wrap">
<div class="hero">
<h1>{{ZH}} ({{EN}}){{PENDING_BADGE}}</h1>
<p>土豆兄弟 (Brotato) · 单角色攻略 · 纯静态单模板</p>
</div>
{{TOC}}
{{VARIANT_TABS}}
{{VARIANT_PANELS}}
<div class="footer">{{FOOTER}}</div>
</div>
<script>
(function(){
"use strict";
var tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
if(!tabs.length) return;
var panels = Array.prototype.slice.call(document.querySelectorAll('[role=tabpanel]'));
function select(label, focus){
  tabs.forEach(function(t){
    var on = t.getAttribute("data-d") === label;
    t.setAttribute("aria-selected", on ? "true" : "false");
    t.tabIndex = on ? 0 : -1;
    if(on && focus) t.focus();
  });
  panels.forEach(function(p){
    var on = p.getAttribute("data-variant-label") === label;
    if(on) p.removeAttribute("hidden");
    else p.setAttribute("hidden", "");
  });
}
tabs.forEach(function(t, i){
  t.addEventListener("click", function(){ select(t.getAttribute("data-d"), false); });
  t.addEventListener("keydown", function(e){
    var j = null;
    if(e.key === "ArrowRight") j = (i+1)%tabs.length;
    else if(e.key === "ArrowLeft") j = (i-1+tabs.length)%tabs.length;
    else if(e.key === "Home") j = 0;
    else if(e.key === "End") j = tabs.length-1;
    if(j !== null){ e.preventDefault(); select(tabs[j].getAttribute("data-d"), true); }
  });
});
})();
</script>

</html>
