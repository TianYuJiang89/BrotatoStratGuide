<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brotato 过程数据动态审计 · 流水线步进视图</title>
<style>
:root {
  --bg: #f7f5ef;
  --card: #ffffff;
  --ink: #1f1b16;
  --muted: #7a7166;
  --line: #e7e0d2;
  --accent: #0b5fff;
  --verified-border: #10b981;
  --verified-bg: #ecfdf5;
  --candidate-border: #f59e0b;
  --candidate-bg: #fffbeb;
  --inferred-border: #8b5cf6;
  --inferred-bg: #f5f3ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  padding-bottom: 60px;
}
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; cursor: pointer; }

/* Top Header Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(247, 245, 239, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand h1 {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -0.3px;
}
.tag-mode {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: #e0f2fe;
  color: #0369a1;
  border: 1px solid #7dd3fc;
}
.topbar-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.source-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  background: #fff;
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 999px;
  color: var(--muted);
}
.source-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
}
.source-dot.live { background: #0b5fff; }
.btn-sm {
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
}
.btn-sm:hover { background: #f0ebe0; border-color: #d1c7b7; }

/* Filter Bar (3D Filter) */
.filter-bar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.filter-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 13px;
}
.filter-label {
  font-weight: 600;
  color: var(--muted);
  width: 80px;
  flex-shrink: 0;
  font-size: 12px;
}
.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.chip {
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #faf8f5;
  color: var(--ink);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
}
.chip:hover { background: #eae4d6; }
.chip.active {
  background: #1f1b16;
  color: #fff;
  border-color: #1f1b16;
  font-weight: 600;
}
.chip.active.chip-verified { background: #059669; border-color: #059669; }
.chip.active.chip-candidate { background: #d97706; border-color: #d97706; }
.chip.active.chip-inferred { background: #7c3aed; border-color: #7c3aed; }

.search-box {
  margin-left: auto;
  position: relative;
  min-width: 220px;
}
.search-input {
  width: 100%;
  padding: 5px 10px 5px 28px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #faf8f5;
  font-size: 12px;
  outline: none;
}
.search-input:focus {
  border-color: var(--accent);
  background: #fff;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 12px;
}
.filter-counter {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.badge-count {
  font-weight: 700;
  color: var(--ink);
}

/* Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  gap: 3px;
}
.badge-verified { background: var(--verified-bg); color: #047857; border: 1px solid var(--verified-border); }
.badge-candidate { background: var(--candidate-bg); color: #b45309; border: 1px solid var(--candidate-border); font-weight: 700; }
.badge-inferred { background: var(--inferred-bg); color: #6d28d9; border: 1px solid var(--inferred-border); }
.badge-count-pill {
  font-size: 11px;
  background: #1f1b16;
  color: #fff;
  border-radius: 999px;
  padding: 1px 6px;
  font-weight: 700;
}

/* Card Styling */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Pipeline Step Tree */
.pipeline-step {
  position: relative;
  padding-left: 28px;
  margin-bottom: 24px;
}
.pipeline-step::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 24px;
  bottom: -24px;
  width: 2px;
  background: var(--line);
}
.pipeline-step:last-child::before { display: none; }
.pipeline-step-node {
  position: absolute;
  left: 0;
  top: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #10b981;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  z-index: 2;
}

.manifest-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.manifest-box {
  background: #faf8f5;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}
.manifest-box .k { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.manifest-box .v { font-size: 13px; font-weight: 600; font-family: monospace; }

.step2-dual {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) { .step2-dual { grid-template-columns: 1fr; } }

.verb-panel {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: #faf8f5;
}
.verb-panel.verified { border-top: 3px solid var(--verified-border); }
.verb-panel.candidates { border-top: 3px solid var(--candidate-border); background: #fffdf7; }

.verb-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin-bottom: 8px;
}
.verb-row:last-child { margin-bottom: 0; }
.verb-row.candidate-row { border-color: var(--candidate-border); background: #fffcf2; }

.group-accordion {
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 12px;
  background: #fff;
  overflow: hidden;
}
.group-acc-head {
  padding: 10px 14px;
  background: #faf8f5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.group-acc-body {
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 10px;
}

.item-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.item-card:hover {
  border-color: #b0a595;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.item-card.is-candidate {
  border-color: var(--candidate-border);
  background: #fffdf5;
}
.item-card.is-inferred {
  border-color: var(--inferred-border);
  background: #faf8ff;
}
.item-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.item-card-name {
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}
.item-card-zh { font-size: 12px; color: var(--muted); font-weight: normal; }
.item-card-reason {
  font-size: 12px;
  color: var(--ink);
  line-height: 1.45;
}
.item-card-quote {
  font-size: 11px;
  color: var(--muted);
  background: #f5f2ea;
  border-radius: 4px;
  padding: 4px 8px;
  border-left: 3px solid var(--line);
  font-style: italic;
}
.item-card.is-candidate .item-card-quote {
  border-left-color: var(--candidate-border);
  background: #fef8e7;
}

/* Slide-over Audit Trace Drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(2px);
  z-index: 80;
  display: none;
}
.drawer-backdrop.open { display: block; }
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(520px, 92vw);
  background: #fff;
  box-shadow: -4px 0 24px rgba(0,0,0,0.15);
  z-index: 90;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  padding: 14px 18px;
  background: #faf8f5;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
.drawer-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
}
.drawer-body {
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  font-size: 13px;
}
.drawer-section {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: #faf8f5;
}
.drawer-section h3 {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
</style>
</head>

    }

    return true;
  });
}

function render() {
  const container = document.getElementById('mainContainer');
  const filtered = getFilteredItems();
  document.getElementById('filteredCount').textContent = filtered.length;

  const m = appData.manifest;
  const s = appData.sentences || [];
  const v = appData.verbs || { verified: [], candidates: [] };

  let html = `
    <!-- Pipeline Step 0: Inputs & Manifest -->
    <div class="pipeline-step completed">
      <div class="pipeline-step-node">0</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span>📦 inputs/ · 契约输入与 Manifest 真实性校验</span>
          </div>
          <span class="badge badge-verified">✅ sha1 校验一致 (${m.sources && m.sources[0] ? m.sources[0].sha1.slice(0, 8) + '...' : 'PASS'})</span>
        </div>
        <div class="manifest-grid">
          <div class="manifest-box"><div class="k">SLUG</div><div class="v">${m.slug}</div></div>
          <div class="manifest-box"><div class="k">VARIANT</div><div class="v">${m.variant} (${(m.covers || []).join(', ')})</div></div>
          <div class="manifest-box"><div class="k">SOP VERSION</div><div class="v">${(m.sop_version || '').slice(0, 8)}</div></div>
          <div class="manifest-box"><div class="k">SOURCE URL</div><div class="v"><a href="${m.sources && m.sources[0] ? m.sources[0].url : '#'}" target="_blank">YouTube 视频 ↗</a></div></div>
        </div>
      </div>
    </div>

    <!-- Pipeline Step 1: 01-sentences -->
    <div class="pipeline-step completed">
      <div class="pipeline-step-node">1</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span>📝 steps/01-sentences/ · 句子解析与清洗</span>
          </div>
          <span class="badge badge-count-pill">${s.length} 句样例文本</span>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">
          清洗契约：丢弃时间戳与格式头部，去除 HTML，单句限长 500 字符。
        </p>
        <div style="max-height:140px;overflow-y:auto;background:#faf8f5;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-family:monospace;font-size:11px;">
          ${s.map(it => `<div><span style="color:#0b5fff;">[#${it.id}]</span> ${it.text}</div>`).join('')}
        </div>
      </div>
    </div>

    <!-- Pipeline Step 2: 02-verbs -->
    <div class="pipeline-step completed">
      <div class="pipeline-step-node">2</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span>⚡ steps/02-verbs/ · 动词归约与机检双重视图</span>
          </div>
          <div>
            <span class="badge badge-verified">${v.verified.length} verified 锚点</span>
            <span class="badge badge-candidate" style="margin-left:4px;">${v.candidates.length} candidates 自由裁量</span>
          </div>
        </div>
        <div class="step2-dual">
          <div class="verb-panel verified">
            <h4 style="font-size:12px;font-weight:700;color:#047857;margin-bottom:8px;">✅ Verified（精确名 + 闭集10动词 + 原文整句）</h4>
            ${v.verified.map(item => `
              <div class="verb-row">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <strong>${item.object_norm}</strong>
                  <span class="badge badge-verified">动词: ${item.verb}</span>
                </div>
                <div style="font-size:11px;color:var(--muted);">"${item.quote}"</div>
              </div>
            `).join('')}
          </div>
          <div class="verb-panel candidates">
            <h4 style="font-size:12px;font-weight:700;color:#b45309;margin-bottom:8px;">⚠️ Candidates（别名归一 / 动词转述 / 意图推断·标黄）</h4>
            ${v.candidates.map(item => `
              <div class="verb-row candidate-row">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <strong>${item.normalized_to}</strong>
                  ${item.inferred ? `<span class="badge badge-inferred">inferred:true</span>` : `<span class="badge badge-candidate">${item.surface_verb} → ${item.mapped_to}</span>`}
                </div>
                <div style="font-size:11px;color:#92400e;margin-top:2px;">理由: ${item.reason}</div>
                <div style="font-size:11px;color:var(--muted);">"${item.quote}"</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- Pipeline Step 3: 03-grouping & outputs -->
    <div class="pipeline-step completed">
      <div class="pipeline-step-node">3</div>
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <span>📊 steps/03-grouping/ & outputs/ · 最终分组与人话理由 (全68项收录)</span>
          </div>
          <span class="badge badge-count-pill">当前展示 ${filtered.length} 项</span>
        </div>

        ${renderGroupAccordion("【必拿·核心 (Must Take - Core)】", filtered.filter(x => x.group === 'must_take' && x.tier === 'core'))}
        ${renderGroupAccordion("【必拿·顺手 (Must Take - Convenient)】", filtered.filter(x => x.group === 'must_take' && x.tier === 'convenient'))}
        ${renderGroupAccordion("【必拿·妥协 (Must Take - Compromise)】", filtered.filter(x => x.group === 'must_take' && x.tier === 'compromise'))}
        ${renderGroupAccordion("【提过未拿 (Mentioned but Skipped)】", filtered.filter(x => x.group === 'mentioned_not_taken'))}
        ${renderGroupAccordion("【明确 Ban (Banned)】", filtered.filter(x => x.group === 'ban'))}
        ${renderGroupAccordion("【路过提及 (Casual Mentions 1-3次)】", filtered.filter(x => x.group === 'casual_mention'))}
      </div>
    </div>
  `;

  container.innerHTML = html;
  bindItemCardClicks();
}

function renderGroupAccordion(title, items) {
  if (items.length === 0) return '';
  return `
    <div class="group-accordion">
      <div class="group-acc-head">
        <span>${title}</span>
        <span class="badge-count-pill">${items.length} 件</span>
      </div>
      <div class="group-acc-body">
        ${items.map(it => renderItemCard(it)).join('')}
      </div>
    </div>
  `;
}

function renderItemCard(it) {
  const isCandidate = it.confidence === 'candidate';
  const isInferred = it.inferred;
  return `
    <div class="item-card ${isCandidate ? 'is-candidate' : ''} ${isInferred ? 'is-inferred' : ''}" data-name="${it.name_en}">
      <div class="item-card-top">
        <div class="item-card-name">
          <span>${it.name_en}</span>
          <span class="item-card-zh">${it.name_zh}</span>
        </div>
        <div>
          ${it.confidence === 'verified' ? '<span class="badge badge-verified">verified</span>' : ''}
          ${isCandidate ? '<span class="badge badge-candidate">candidate</span>' : ''}
          ${isInferred ? '<span class="badge badge-inferred">inferred:true</span>' : ''}
          <span class="badge-count-pill" title="出现频次">${it.count}次</span>
        </div>
      </div>
      <div class="item-card-reason">${it.reason}</div>
      ${it.quotes && it.quotes.length ? `<div class="item-card-quote">“${it.quotes[0]}”</div>` : ''}
    </div>
  `;
}

// Drawer Interactions
function bindItemCardClicks() {
  document.querySelectorAll('[data-name]').forEach(el => {
    el.addEventListener('click', () => {
      const name = el.dataset.name;
      const item = appData.items.find(x => x.name_en === name);
      if (item) openDrawer(item);
    });
  });
}

function openDrawer(item) {
  state.selectedItem = item;
  document.getElementById('drawerItemName').innerHTML = `${item.name_en} <span style="font-weight:normal;font-size:13px;color:var(--muted);">(${item.name_zh})</span>`;

  let contentHtml = `
    <div class="drawer-section">
      <h3>1. 属性与置信信号</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
        <span class="badge-count-pill">频次: ${item.count}</span>
        ${item.confidence === 'verified' ? '<span class="badge badge-verified">Verified (机检锚点)</span>' : '<span class="badge badge-candidate">Candidates (自由裁量·标黄)</span>'}
        ${item.inferred ? '<span class="badge badge-inferred">Inferred:true (无动词意图)</span>' : ''}
        ${item.tier ? `<span class="badge badge-${item.tier}">${item.tier}</span>` : ''}
      </div>
      <div style="font-size:12px;line-height:1.5;">${item.discretion_reason || '正常收录'}</div>
    </div>

    <div class="drawer-section">
      <h3>2. 人看一单审核 Gate (Reviewer Checklist)</h3>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked disabled> <span>出处真实（有原文字幕句子定位）</span></label>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked disabled> <span>理由为人话（说明为什么拿 / 为什么不拿）</span></label>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked disabled> <span>无模具怪话（不出现通用套话）</span></label>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" checked disabled> <span>无计数泄漏（理由内不写死次数数字）</span></label>
      </div>
    </div>

    <div class="drawer-section">
      <h3>3. 分组输出理由 (outputs/groups.json)</h3>
      <div style="font-weight:600;margin-bottom:4px;color:var(--ink);">${item.reason}</div>
    </div>

    <div class="drawer-section">
      <h3>4. 原始引用穿透 (Step 01 / 02 Traceability)</h3>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${item.quotes && item.quotes.length ? item.quotes.map((q, idx) => `
          <div style="background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;">
            <div style="font-weight:700;color:var(--accent);margin-bottom:2px;">[Quote #${idx + 1}]</div>
            <div style="font-style:italic;">“${q}”</div>
          </div>
        `).join('') : '<div style="color:var(--muted);">无直接引用</div>'}
      </div>
    </div>
  `;

  document.getElementById('drawerContent').innerHTML = contentHtml;
  document.getElementById('drawerBackdrop').classList.add('open');
  document.getElementById('itemDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('open');
  document.getElementById('itemDrawer').classList.remove('open');
}

document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);

// Directory Picker (File System Access API)
document.getElementById('btnPickDir').addEventListener('click', async () => {
  if (!('showDirectoryPicker' in window)) {
    alert('当前环境不支持 showDirectoryPicker API，请通过本地 HTTP Server 访问或使用备用上传。');
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker();
    await loadFromDirectoryHandle(dirHandle);
  } catch (err) {
    if (err.name !== 'AbortError') {
      alert('读取本地目录失败: ' + err.message);
    }
  }
});

async function loadFromDirectoryHandle(dirHandle) {
  try {
    document.getElementById('sourceText').textContent = `正在读取本地目录: ${dirHandle.name}...`;
    let manifestData = null;
    try {
      const inputsDir = await dirHandle.getDirectoryHandle('inputs');
      const manifestFile = await inputsDir.getFileHandle('manifest.json');
      const file = await manifestFile.getFile();
      manifestData = JSON.parse(await file.text());
    } catch (e) {
      console.warn("Could not find inputs/manifest.json", e);
    }

    if (manifestData) {
      appData.manifest = manifestData;
      state.dataSource = 'live';
      document.getElementById('sourceDot').className = 'source-dot live';
      document.getElementById('sourceText').textContent = `数据源：本地工作区 (${dirHandle.name})`;
      render();
    } else {
      alert(`已选择目录 ${dirHandle.name}，但未找到标准的 inputs/manifest.json。`);
    }
  } catch (err) {
    alert('解析目录出错: ' + err.message);
  }
}

// Fallback directory upload
document.getElementById('fallbackDirInput').addEventListener('change', async (e) => {
  const files = e.target.files;
  if (!files || files.length === 0) return;
  document.getElementById('sourceText').textContent = `已载入 ${files.length} 个本地文件`;
  document.getElementById('sourceDot').className = 'source-dot live';
});

// Reset to Mock
document.getElementById('btnResetMock').addEventListener('click', () => {
  loadMockData();
  state.dataSource = 'mock';
  document.getElementById('sourceDot').className = 'source-dot';
  document.getElementById('sourceText').textContent = '数据源：内置 Mock 数据 (Cyborg/Ultimate 68件)';
  render();
});

// HTTP Base Fetch
async function loadFromHttpBase(base) {
  try {
    document.getElementById('sourceText').textContent = `读取 HTTP: ${base}...`;
    const res = await fetch(`${base}/inputs/manifest.json`);
    if (res.ok) {
      appData.manifest = await res.json();
      state.dataSource = 'live';
      document.getElementById('sourceDot').className = 'source-dot live';
      document.getElementById('sourceText').textContent = `数据源：HTTP (${base})`;
      render();
    }
  } catch (err) {
    console.warn("HTTP base fetch failed:", err);
  }
}

// Filter listeners
function setupFilterListeners() {
  document.querySelectorAll('#filterCountGroup .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filterCountGroup .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.filters.count = chip.dataset.val;
      render();
    });
  });

  document.querySelectorAll('#filterConfidenceGroup .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filterConfidenceGroup .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.filters.confidence = chip.dataset.val;
      render();
    });
  });

  document.querySelectorAll('#filterVerbGroup .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#filterVerbGroup .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.filters.verb = chip.dataset.val;
      render();
    });
  });

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    state.filters.search = e.target.value.trim();
    render();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });
}

function loadMockData() {
  appData = JSON.parse(JSON.stringify(MOCK_DATA));
}

window.addEventListener('DOMContentLoaded', () => {
  setupFilterListeners();
  loadMockData();
  const params = new URLSearchParams(window.location.search);
  const baseParam = params.get('base');
  if (baseParam) {
    loadFromHttpBase(baseParam);
  }
  render();
});
</script>
